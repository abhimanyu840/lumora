[package]
name = "lumora-core"
version = "0.1.0"
edition = "2021"
authors = ["Lumora Developers"]
description = "Core pixel buffers, color spaces, and non-destructive DAG pipeline for Lumora"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
