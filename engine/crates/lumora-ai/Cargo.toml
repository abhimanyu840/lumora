[package]
name = "lumora-ai"
version = "0.1.0"
edition = "2021"
authors = ["Lumora Developers"]
description = "Local on-device AI inference pipeline and tensor caching for Lumora"

[dependencies]
lumora-core = { path = "../lumora-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ndarray = { version = "0.17", features = ["rayon", "serde"] }
